name: Ajuste unico Tiramisu Coco
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  adjust:
    if: github.event.head_commit.message == 'Prepara reenquadramento do Tiramisu Coco'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Reenquadrar imagem e remover workflow temporario
        run: |
          python -m pip install --quiet pillow
          python <<'PY'
          from PIL import Image
          p="public/produtos/tiramisu-coco.webp"
          im=Image.open(p).convert("RGB")
          mask=Image.new("L",im.size,0)
          src=im.load(); dst=mask.load()
          for y in range(im.height):
              for x in range(im.width):
                  r,g,b=src[x,y]
                  # produto marrom/dourado versus fundo branco
                  if min(r,g,b) < 238:
                      dst[x,y]=255
          bbox=mask.getbbox()
          if not bbox: raise SystemExit("produto nao detectado")
          l,t,r,b=bbox
          w,h=r-l,b-t
          pad=max(45,int(max(w,h)*0.10))
          l=max(0,l-pad); t=max(0,t-pad); r=min(im.width,r+pad); b=min(im.height,b+pad)
          crop=im.crop((l,t,r,b))
          crop.thumbnail((1160,1160),Image.Resampling.LANCZOS)
          out=Image.new("RGB",(1400,1400),"white")
          out.paste(crop,((1400-crop.width)//2,(1400-crop.height)//2))
          out.save(p,"WEBP",quality=94,method=6)
          print("original",im.size,"bbox",bbox,"reenquadrado",crop.size)
          PY
          rm -f .github/workflows/ajuste-tiramisu.yml
          git config user.name "Valenza Bot"
          git config user.email "actions@github.com"
          git add public/produtos/tiramisu-coco.webp .github/workflows/ajuste-tiramisu.yml
          git commit -m "Reenquadra Tiramisu Coco sem alterar o layout"
          git push origin HEAD:main
