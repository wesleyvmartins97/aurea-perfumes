name: Corrigir enquadramento Tiramisu Coco
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message == 'Prepara correcao final da foto Tiramisu Coco'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remover marcas e aproximar produto
        run: |
          python -m pip install --quiet pillow opencv-python-headless numpy
          python <<'PY'
          from PIL import Image
          import cv2, numpy as np
          p="public/produtos/tiramisu-coco.webp"
          im=Image.open(p).convert("RGB")
          a=np.array(im)
          # Máscara do conteúdo que não é fundo branco.
          mask=(np.min(a,axis=2)<238).astype(np.uint8)*255
          n, labels, stats, cents=cv2.connectedComponentsWithStats(mask,8)
          # Mantém apenas componentes realmente grandes: caixa e frasco.
          keep=[]
          for i in range(1,n):
              x,y,w,h,area=stats[i]
              if area>=2500 and w>=25 and h>=25:
                  keep.append((i,x,y,w,h,area))
          if not keep:
              raise SystemExit("Nenhum componente principal encontrado")
          xs=[x for _,x,y,w,h,a in keep]
          ys=[y for _,x,y,w,h,a in keep]
          rs=[x+w for _,x,y,w,h,a in keep]
          bs=[y+h for _,x,y,w,h,a in keep]
          l,t,r,b=min(xs),min(ys),max(rs),max(bs)
          # Margem curta; os risquinhos ficam fora.
          w,h=r-l,b-t
          padx=max(22,int(w*.06)); pady=max(22,int(h*.06))
          l=max(0,l-padx); r=min(im.width,r+padx)
          t=max(0,t-pady); b=min(im.height,b+pady)
          crop=im.crop((l,t,r,b))
          # Limpa qualquer marca residual próxima das bordas do recorte.
          ca=np.array(crop)
          cmask=(np.min(ca,axis=2)<238).astype(np.uint8)*255
          nn,ll,ss,cc=cv2.connectedComponentsWithStats(cmask,8)
          clean=np.full_like(ca,255)
          for i in range(1,nn):
              x,y,w,h,area=ss[i]
              if area>=2500 and w>=25 and h>=25:
                  clean[ll==i]=ca[ll==i]
          crop=Image.fromarray(clean)
          # Produto ocupa quase todo o quadro, preservando proporção.
          crop.thumbnail((1240,1240),Image.Resampling.LANCZOS)
          out=Image.new("RGB",(1400,1400),"white")
          out.paste(crop,((1400-crop.width)//2,(1400-crop.height)//2))
          out.save(p,"WEBP",quality=95,method=6)
          print("componentes",[(x,y,w,h,a) for _,x,y,w,h,a in keep])
          print("bbox final",(l,t,r,b),"conteudo final",crop.size)
          PY
          rm -f .github/workflows/fix-tiramisu-final.yml
          git config user.name "Valenza Bot"
          git config user.email "actions@github.com"
          git add public/produtos/tiramisu-coco.webp .github/workflows/fix-tiramisu-final.yml
          git commit -m "Aproxima Tiramisu Coco e remove marcas da imagem"
          git push origin HEAD:main
