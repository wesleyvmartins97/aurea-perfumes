name: Padrão responsivo aprovado
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preservar-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir estilos aprovados do computador e celular
        run: node scripts/validate-responsive.mjs
      - name: Conferir filtros, paginação e retorno dos detalhes
        run: |
          node scripts/test-catalog-navigation.mjs
          node scripts/test-catalog-pagination.mjs
      - name: Conferir links compartilháveis dos perfumes
        run: node scripts/test-product-share-links.mjs
      - name: Conferir compartilhamento em catálogo, detalhes e carrinho
        run: node scripts/test-product-links-everywhere.mjs
      - name: Conferir rotas do carrinho, checkout e botão Voltar
        run: node scripts/test-shop-routes.mjs
      - name: Preparação Asaas sem alterar pagamentos ativos
        run: node scripts/test-asaas-checkout.mjs
      - name: Simular Asaas Pix e autenticação de webhook sem dinheiro real
        run: node scripts/test-asaas-api.mjs
      - name: Confirmar pagamento com tela VALENZA e fechar em 5 segundos
        run: node scripts/test-valenza-payment-success.mjs
      - name: Conferir ciclo dos destaques
        run: node scripts/test-featured-selection.mjs
      - name: Conferir cabeçalho em celular estreito
        run: node scripts/test-mobile-header-fit.mjs
