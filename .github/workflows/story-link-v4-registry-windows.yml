name: Valenza LAB V4 - Windows PowerShell registry regression
on:
  push:
    branches:
      - lab-story-links-isolado-20261118
    paths:
      - ".github/workflows/story-link-v4-registry-windows.yml"
  pull_request:
    paths:
      - ".github/workflows/story-link-v4-registry-windows.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-registry-discovery:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: "Reproduzir caminho do registro com Windows PowerShell 5.1"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pythonExe = (Get-Command python.exe).Source
          $pythonDir = Split-Path -Parent $pythonExe
          $regPath = 'HKCU:\Software\Python\PythonCore\ValenzaV4Regression\InstallPath'
          New-Item -Path $regPath -Force | Out-Null
          Set-Item -Path $regPath -Value $pythonDir
          try {
            $found = $null
            foreach ($regRoot in @('HKCU:\Software\Python\PythonCore','HKLM:\Software\Python\PythonCore','HKLM:\Software\WOW6432Node\Python\PythonCore')) {
              if (-not (Test-Path $regRoot)) { continue }
              foreach ($ver in (Get-ChildItem $regRoot -ErrorAction SilentlyContinue)) {
                $regInstall = Join-Path $ver.PSPath 'InstallPath'
                if (Test-Path $regInstall) {
                  $key = Get-Item $regInstall
                  $pythonHomeDir = [string]$key.GetValue('')
                  $exe = [string]$key.GetValue('ExecutablePath')
                  if ($exe -and (Test-Path -LiteralPath $exe -PathType Leaf)) { $found = $exe }
                  if ($pythonHomeDir -and (Test-Path -LiteralPath (Join-Path $pythonHomeDir 'python.exe') -PathType Leaf)) { $found = Join-Path $pythonHomeDir 'python.exe' }
                }
              }
            }
            if (-not $found) { throw 'Windows Python Registry discovery V4 failed' }
            $venv = Join-Path $env:RUNNER_TEMP 'valenza-lab-v4-regression'
            & $found -m venv $venv
            if ($LASTEXITCODE -ne 0) { throw 'Python -m venv failed' }
            $labPy = Join-Path $venv 'Scripts\python.exe'
            if (-not (Test-Path -LiteralPath $labPy -PathType Leaf)) { throw 'Python venv executable was not created' }
            & $labPy -c 'import sys;sys.exit(0 if sys.version_info >= (3,11) else 3)'
            if ($LASTEXITCODE -ne 0) { throw 'Python version check failed' }
            $packageVersion = & $labPy -c 'import importlib.metadata as md,sys;print(md.version(sys.argv[1]))' pip
            if ($LASTEXITCODE -ne 0 -or -not $packageVersion) { throw 'PowerShell Python -c argument check failed' }
            Write-Host 'WINDOWS POWERSHELL V4 REGISTRY DISCOVERY + ISOLATED VENV: PASS'
            & $labPy -m pip --disable-pip-version-check install --prefer-binary 'instagrapi==3.2.15'
            if ($LASTEXITCODE -ne 0) { throw 'Instagram test library install failed on actual Windows' }
            & $labPy -c 'from instagrapi import Client;from instagrapi.types import StoryLink;import inspect,sys;assert sys.argv[1] in inspect.signature(Client.photo_upload_to_story).parameters;assert StoryLink(webUri=sys.argv[2])' links https://www.valenzaparfums.com.br/perfume/sabah-al-ward-pearl/
            if ($LASTEXITCODE -ne 0) { throw 'instagrapi StoryLink or photo_upload_to_story incompatible' }
            Write-Host 'WINDOWS INSTAGRAPI 3.2.15 INSTALL + STORY LINK SIGNATURE: PASS (NO LOGIN)'
          }
          finally {
            Remove-Item -Path 'HKCU:\Software\Python\PythonCore\ValenzaV4Regression' -Recurse -Force -ErrorAction SilentlyContinue
          }
