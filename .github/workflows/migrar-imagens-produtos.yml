name: Migrar imagens dos produtos para local

on:
  push:
    paths:
      - '.github/workflows/migrar-imagens-produtos.yml'

permissions:
  contents: write

jobs:
  migrar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install --quiet pillow
      - name: Baixar, otimizar e validar 20 imagens
        shell: python
        run: |
          import os, urllib.request, tempfile
          from PIL import Image, ImageOps
          items = [
            ("angham-second-song","https://p16-oec-general-useast5.ttcdn-us.com/tos-useast5-i-omjb5zjo8w-tx/fb5aea032aff4583a46ebf107d851c89~tplv-fhlh96nyum-crop-webp%3A1024%3A1024.webp?dr=12190&from=2378011839&idc=useast5&ps=933b5bde&shcp=e1be8f53&shp=8dbd94bf&t=555f072d"),
            ("athena","https://fragranceonabarrel.com/cdn/shop/files/Maison_Alhambra_Parfum_Athena_Eau_de_Parfum_100ml_1_1800x1800_714e3abc-ba62-4ea9-8ad3-a9fb4565bf70.webp?v=1745048529&width=1946"),
            ("delilah-blanc","https://cdn.awsli.com.br/150/150124/produto/368109356/captura-de-tela-2025-08-22-a-s-15-08-19-c2a9gi3uju.png"),
            ("delilah","https://www.sunsetperfumes.com/cdn/shop/files/ChatGPT_Image_16_03_2026_15_33_50.png?v=1773686047&width=1024"),
            ("fakhar-rose","https://i.ebayimg.com/images/g/a0wAAOSwAbRl-Qt6/s-l1200.jpg"),
            ("sabah","https://cdn.awsli.com.br/600x450/2639/2639447/produto/249914140/sem-t-tulo-8-5drsxxop99.png"),
            ("asad","https://priveperfumes.com/cdn/shop/files/perfume-lattafa-asad-edp-m-100-ml-1-prive-perfumes.webp?v=1743662566&width=1024"),
            ("attar","https://acdn-us.mitiendanube.com/stores/001/167/965/products/attar-21-121775f1d608eb6c9b16891977620244-1024-1024.webp"),
            ("decant-sabah","https://images.tcdn.com.br/img/img_prod/1228919/kit_de_decants_dos_perfumes_arabes_al_wataniah_100_original_sabah_al_ward_5_ml_e_durrat_al_aroos_5_m_123_2_2c168fcc9d1bcedbb8e125c69a628173.jpeg"),
            ("ameerati","https://cdn.fragrancenet.com/images/photos/900x900/474313.jpg"),
            ("angham","https://p19-oec-general-useast5.ttcdn-us.com/tos-useast5-i-omjb5zjo8w-tx/31ba5b74d78a400da4d84343274bc72b~tplv-fhlh96nyum-crop-webp%3A4134%3A3854.webp?dr=12190&from=2378011839&idc=useast5&ps=933b5bde&shcp=e1be8f53&shp=8dbd94bf&t=555f072d"),
            ("vanilla-voyage","https://www.perfumenz.co.nz/cdn/shop/files/maison-asrar-vanilla-voyage_700x700.png?v=1768272319"),
            ("atheeri","https://cdn.dooca.store/181275/products/frasco-lattafa-atheeri-100ml-edp-feminino-floral-ambar-perfumes.jpg?v=1771207708"),
            ("club-de-nuit-intense-man","https://flyimports.com/cdn/shop/files/CLUB1.png?v=1770857003&width=1024"),
            ("musamam-white-intense","https://husainfragrance.co.za/cdn/shop/collections/1000232933.png?v=1777990860"),
            ("afeef","https://www.cnobre-store.com/cdn/shop/files/Afeef-Lattafa-Original-1e16f6a4.png?v=1780587216&width=900"),
            ("queen-of-arabia","https://www.intenseoud.com/cdn/shop/files/1_796f766f-21f4-4ca7-820a-a98c776ce72a.webp?v=1774783776"),
            ("yara","https://cdn.vuahanghieu.com/unsafe/0x900/left/top/smart/filters%3Aquality%2890%29/https%3A/admin.vuahanghieu.com/upload/product/2025/04/nuoc-hoa-nu-lattafa-yara-fragrance-bundle-eau-de-parfum-100ml-67f71df7d961d-10042025082511.png"),
            ("tharwah-gold","https://tiendalafe.com/cdn/shop/files/Disenosintitulo-2025-07-18T124522.470.png?v=1752864346"),
            ("vulcan-feu","https://bplatz.de/cdn/shop/files/fragrance-world-vulcan-feu_1200x1200_a18800bb-2597-4288-a0d4-10a160d48a80.webp?v=1756819437&width=1200"),
          ]
          os.makedirs("public/produtos", exist_ok=True)
          opener=urllib.request.build_opener()
          opener.addheaders=[("User-Agent","Mozilla/5.0")]
          for slug,url in items:
            fd,tmp=tempfile.mkstemp(); os.close(fd)
            try:
              opener.retrieve(url,tmp)
              with Image.open(tmp) as im:
                im=ImageOps.exif_transpose(im)
                if im.mode not in ("RGB","RGBA"): im=im.convert("RGBA")
                im.thumbnail((1000,1000),Image.Resampling.LANCZOS)
                im.save(f"public/produtos/{slug}.webp","WEBP",quality=84,method=6)
            finally:
              if os.path.exists(tmp): os.remove(tmp)
          files=[f for f in os.listdir("public/produtos") if f.endswith(".webp")]
          assert len(files)==20, f"Esperava 20 imagens, encontrei {len(files)}"
      - name: Trocar somente URLs das imagens no catálogo
        shell: python
        run: |
          import re
          p="public/products.js"
          s=open(p,encoding="utf-8").read()
          ids=re.findall(r"id:'([^']+)'",s)
          assert len(ids)==20 and len(set(ids))==20
          for slug in ids:
            pat=r"(id:'"+re.escape(slug)+r"'[^}]*?img:)'[^']*'"
            s2,n=re.subn(pat,r"\1'/produtos/"+slug+".webp'",s,count=1)
            assert n==1, f"Não achei imagem de {slug}"
            s=s2
          open(p,"w",encoding="utf-8").write(s)
          assert len(re.findall(r"img:'/produtos/[^']+\.webp'",s))==20
      - name: Auditoria antes do commit
        shell: bash
        run: |
          test "$(find public/produtos -maxdepth 1 -name '*.webp' | wc -l)" -eq 20
          grep -q "const CATALOG=" public/products.js
          grep -q '<script src="/products.js' public/index.html
          grep -q "/api/pagamento" public/index.html
          grep -q "/api/frete" public/index.html
      - name: Commit seguro
        run: |
          git config user.name "VALENZA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/produtos public/products.js
          git commit -m "perf: hospedar e otimizar imagens dos produtos"
          git push
