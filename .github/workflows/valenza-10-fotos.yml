name: Instalar 10 fotos Valenza
on:
  workflow_dispatch:
  push:
    branches:
      - tmp-valenza-10-fotos
permissions:
  contents: write
  actions: read
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Baixar pacote auditado e instalar imagens
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/valenza-artifact /tmp/valenza-images
          curl -L --fail             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10990158499/zip"             -o /tmp/valenza-artifact/outer.zip
          unzip -o /tmp/valenza-artifact/outer.zip -d /tmp/valenza-artifact
          unzip -o /tmp/valenza-artifact/valenza-10-fotos.zip -d /tmp/valenza-images
          for f in khamrah.webp khamrah-qahwa.webp eclaire.webp liquid-brun.webp spectre-ghost.webp afnan-9pm.webp hawas-ice.webp yara-candy.webp tiramisu-coco.webp fatima-pink.webp; do
            test -s "/tmp/valenza-images/$f"
            cp "/tmp/valenza-images/$f" "public/produtos/$f"
          done
          test "$(find public/produtos -maxdepth 1 -type f \( -name 'khamrah.webp' -o -name 'khamrah-qahwa.webp' -o -name 'eclaire.webp' -o -name 'liquid-brun.webp' -o -name 'spectre-ghost.webp' -o -name 'afnan-9pm.webp' -o -name 'hawas-ice.webp' -o -name 'yara-candy.webp' -o -name 'tiramisu-coco.webp' -o -name 'fatima-pink.webp' \) | wc -l)" -eq 10
          git config user.name "Valenza Bot"
          git config user.email "actions@github.com"
          git add public/produtos/*.webp
          git diff --cached --quiet && exit 0
          git commit -m "Adiciona imagens dos 10 novos perfumes"
          git push origin HEAD:main
