name: Integridade do catálogo

on:
  push:
    branches: [main]
    paths:
      - 'public/products.js'
      - 'public/privacidade/**'
      - 'scripts/validate-google-commerce.mjs'
      - 'public/google-commerce.js'
      - 'scripts/generate-seo.mjs'
      - 'public/merchant-feed.xml'
      - 'public/google-merchant.xml'
      - 'scripts/validate-merchant.mjs'
      - 'scripts/generate-merchant.mjs'
      - 'public/favicon.png'
      - 'public/index.html'
      - 'public/admin/**'
      - 'public/admin-account.js'
      - 'scripts/validate-admin.mjs'
      - 'scripts/test-checkout-recovery.mjs'
      - 'scripts/test-meta-tracking.mjs'
      - 'scripts/test-meta-capi.mjs'
      - 'scripts/test-order-lifecycle.mjs'
      - 'wrangler.jsonc'
      - 'public/perfume/**'
      - 'public/produtos/**'
      - 'public/sitemap.xml'
      - 'src/worker.js'
      - 'src/merchant-fulfillment.mjs'
      - 'scripts/test-merchant-fulfillment.mjs'
      - 'scripts/validate-catalog.mjs'
      - '.github/workflows/catalog-integrity.yml'
  pull_request:
    paths:
      - 'public/products.js'
      - 'public/google-merchant.xml'
      - 'public/privacidade/**'
      - 'scripts/validate-google-commerce.mjs'
      - 'public/google-commerce.js'
      - 'scripts/generate-seo.mjs'
      - 'public/merchant-feed.xml'
      - 'scripts/validate-merchant.mjs'
      - 'scripts/generate-merchant.mjs'
      - 'public/favicon.png'
      - 'public/index.html'
      - 'public/admin/**'
      - 'public/admin-account.js'
      - 'scripts/validate-admin.mjs'
      - 'scripts/test-checkout-recovery.mjs'
      - 'scripts/test-meta-tracking.mjs'
      - 'scripts/test-meta-capi.mjs'
      - 'scripts/test-order-lifecycle.mjs'
      - 'wrangler.jsonc'
      - 'public/perfume/**'
      - 'public/produtos/**'
      - 'public/sitemap.xml'
      - 'src/worker.js'
      - 'src/merchant-fulfillment.mjs'
      - 'scripts/test-merchant-fulfillment.mjs'
      - 'scripts/validate-catalog.mjs'
      - '.github/workflows/catalog-integrity.yml'

jobs:
  validar-catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe do gerador SEO
        run: node --check scripts/generate-seo.mjs
      - name: Validar sintaxe do gerador Merchant
        run: node --check scripts/generate-merchant.mjs
      - name: Validar sintaxe do auditor Merchant
        run: node --check scripts/validate-merchant.mjs
      - name: Regenerar SEO e confirmar sincronismo
        run: |
          node scripts/generate-seo.mjs
          git diff --exit-code -- public/perfume public/sitemap.xml
      - name: Regenerar Merchant e confirmar sincronismo
        run: |
          node scripts/generate-merchant.mjs
          git diff --exit-code -- public/merchant-feed.xml public/google-merchant.xml
      - name: Testar disponibilidade e previsão de postagem
        run: node scripts/test-merchant-fulfillment.mjs
      - name: Validar Merchant feed
        run: node scripts/validate-merchant.mjs
      - name: Validar sintaxe do tracking Google
        run: node --check public/google-commerce.js
      - name: Validar sintaxe do auditor Google
        run: node --check scripts/validate-google-commerce.mjs
      - name: Auditar tracking Google
        run: node scripts/validate-google-commerce.mjs
      - name: Testar carregamento assíncrono do Google e consentimento
        run: node scripts/test-google-loading.mjs
      - name: Testar Pixel Meta e consentimento
        run: node scripts/test-meta-tracking.mjs
      - name: Testar validação de compras na API de Conversões
        run: node scripts/test-meta-capi.mjs
      - name: Validar sintaxe do painel administrativo
        run: node --check public/admin-account.js
      - name: Validar painel administrativo
        run: node scripts/validate-admin.mjs
      - name: Testar histórico e atribuição da recuperação de checkout
        run: node scripts/test-checkout-recovery.mjs
      - name: Testar jornada de compra sem transações reais
        run: node scripts/test-order-lifecycle.mjs
      - name: Validar sintaxe do Worker
        run: node --check src/worker.js
      - name: Validar sintaxe do catálogo
        run: node --check public/products.js
      - name: Validar catálogo completo
        run: node scripts/validate-catalog.mjs
