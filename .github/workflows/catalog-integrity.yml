name: Integridade do catálogo

on:
  push:
    branches: [main]
    paths:
      - 'public/products.js'
      - 'public/perfume/**'
      - 'public/produtos/**'
      - 'public/sitemap.xml'
      - 'src/worker.js'
      - 'scripts/validate-catalog.mjs'
      - '.github/workflows/catalog-integrity.yml'
  pull_request:
    paths:
      - 'public/products.js'
      - 'public/perfume/**'
      - 'public/produtos/**'
      - 'public/sitemap.xml'
      - 'src/worker.js'
      - 'scripts/validate-catalog.mjs'

jobs:
  validar-catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe do Worker
        run: node --check src/worker.js
      - name: Validar sintaxe do catálogo
        run: node --check public/products.js
      - name: Validar catálogo completo
        run: node scripts/validate-catalog.mjs
